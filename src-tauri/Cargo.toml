[package]
name = "bay"
version = "0.1.0"
description = "Bay — single-user desktop task manager with capacity caps"
edition = "2021"
rust-version = "1.77"
# The crate ships two binaries — `bay` (the Tauri app) and the
# `rank_fixture_gen` dev tool in src/bin/. `tauri dev` runs a bare
# `cargo run`, which is ambiguous with >1 bin; pin the app as the default
# so `cargo run` / `tauri dev` launches `bay`. (`cargo run --bin
# rank_fixture_gen` still works explicitly.)
default-run = "bay"

[lib]
name = "bay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

uuid = { version = "1", features = ["v7"] }
keyring = "3"

axum = "0.7"
tokio = { version = "1", features = ["full"] }
qrcode = "0.14"
local-ip-address = "0.6"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
# Mockito: HTTP mock server for OpenAiCompatClient tests. Lets cargo
# test exercise auth failure, rate limiting, malformed responses, and
# the timeout path without a real network. Dev-only; doesn't ship.
mockito = "1"
# Proptest: property-based testing for the load-bearing invariants
# (rank_between bounds; projection determinism; swap atomicity;
# write_events rollback; get_items_at monotonicity). The non-LLM
# oracle for the 6 critical modules per AUTONOMY_CHARTER §9 / the
# Externality Principle. Dev-only; doesn't ship.
proptest = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
