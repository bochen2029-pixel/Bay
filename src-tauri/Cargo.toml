[package]
name = "bay"
version = "0.1.0"
description = "Bay — single-user desktop task manager with capacity caps"
edition = "2021"
rust-version = "1.77"

[lib]
name = "bay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

[features]
custom-protocol = ["tauri/custom-protocol"]
